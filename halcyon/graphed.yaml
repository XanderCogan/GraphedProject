slug: halcyon-botanicals
name: Halcyon Botanicals

# Scaffold provenance. The Graphed CLI reads this to check plugin
# compatibility; it is stripped on deploy and never sent to the server.
scaffold:
  name: base
  version: 0.1.0

databases:
  primary:
    env: DATABASE_URL

release:
  command: npm run db:migrate
  timeout_seconds: 600
  retries: 1

services:
  dashboard:
    command: node packages/dashboard/.next/standalone/packages/dashboard/server.js
    port: 3000
    healthcheck: /api/health
    env:
      - WAREHOUSE_SCHEMA
    # Services are private by default — reaching this dashboard requires
    # Graphed authentication. Opt specific routes into public access
    # explicitly (e.g. webhooks), never the whole app:
    #   public:
    #     paths:
    #       - ^/api/webhooks/.*

jobs:
  example-daily:
    command: npm run job:example-daily
    schedule:
      cron: 0 13 * * *
      timezone: America/New_York
    timeout_seconds: 900
    retries: 1
  # Meta ads agent: reads the warehouse, applies the fatigue and CPA rules to
  # prospecting campaigns only, writes a brief and ranked recommendations.
  # Never writes to Meta. Not idempotent (one run row per execution), so no
  # retries; a failed run stays visible on the /meta-ads page.
  meta-ads-daily:
    command: npm run job:meta-ads-daily
    schedule:
      cron: 0 8 * * *
      timezone: America/Chicago
    timeout_seconds: 900
    retries: 0
    env:
      - WAREHOUSE_SCHEMA
